server:
  port: ${PORT:8080}
  address: ${HOST:127.0.0.1}
  error:
    include-message: never
spring:
  datasource:
    url: ${AMS_DB_URL:jdbc:h2:file:./data/ams-mvp;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: ${AMS_DB_PASSWORD:}
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      base-path: /
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      show-details: never
ams:
  scheduling: ${AMS_SCHEDULING:true}
  public-url: ${AMS_PUBLIC_URL:http://localhost:8180}
  smtp:
    host: ${AMS_SMTP_HOST:}
    port: ${AMS_SMTP_PORT:587}
    username: ${AMS_SMTP_USERNAME:}
    password: ${AMS_SMTP_PASSWORD:}
    from: ${AMS_SMTP_FROM:}
    auth: ${AMS_SMTP_AUTH:true}
    starttls: ${AMS_SMTP_STARTTLS:true}
    ssl: ${AMS_SMTP_SSL:false}
